name : mlops 

on:
  push:
    branches: ["main"]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
        - uses: action/checkout@v3

        - name: Install dependencies
          run: pip install -r requirements.txt

        - name: Run tests
          run: python -m pytest
          
        - name: Run training 
          run: python -m src.train
